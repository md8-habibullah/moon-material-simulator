  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="238.139">
<div id="cap0" class="clip cap" data-start="0.250" data-duration="0.998"><span class="box">On the Moon and on</span></div>
<div id="cap1" class="clip cap" data-start="1.258" data-duration="1.840"><span class="box">Mars, there are machines NASA</span></div>
<div id="cap2" class="clip cap" data-start="3.108" data-duration="0.992"><span class="box">left behind.</span></div>
<div id="cap3" class="clip cap" data-start="4.313" data-duration="1.989"><span class="box">A lander from 1967.</span></div>
<div id="cap4" class="clip cap" data-start="6.557" data-duration="1.835"><span class="box">Rovers parked by astronauts.</span></div>
<div id="cap5" class="clip cap" data-start="8.429" data-duration="1.294"><span class="box">A little helicopter that flew</span></div>
<div id="cap6" class="clip cap" data-start="9.733" data-duration="1.309"><span class="box">72 times.</span></div>
<div id="cap7" class="clip cap" data-start="11.296" data-duration="0.987"><span class="box">They're abandoned,</span></div>
<div id="cap8" class="clip cap" data-start="12.293" data-duration="1.156"><span class="box">but not forgotten:</span></div>
<div id="cap9" class="clip cap" data-start="13.704" data-duration="1.173"><span class="box">each one still tells us</span></div>
<div id="cap10" class="clip cap" data-start="14.887" data-duration="1.195"><span class="box">what those worlds do to</span></div>
<div id="cap11" class="clip cap" data-start="16.092" data-duration="1.681"><span class="box">the things we build.</span></div>
<div id="cap12" class="clip cap" data-start="18.253" data-duration="1.481"><span class="box">When Apollo 12 landed next</span></div>
<div id="cap13" class="clip cap" data-start="19.744" data-duration="1.183"><span class="box">to Surveyor 3,</span></div>
<div id="cap14" class="clip cap" data-start="20.974" data-duration="1.242"><span class="box">the crew brought pieces of</span></div>
<div id="cap15" class="clip cap" data-start="22.226" data-duration="0.784"><span class="box">it home.</span></div>
<div id="cap16" class="clip cap" data-start="23.281" data-duration="1.334"><span class="box">After 31 months on the</span></div>
<div id="cap17" class="clip cap" data-start="24.625" data-duration="1.651"><span class="box">Moon, they were darkened by</span></div>
<div id="cap18" class="clip cap" data-start="26.286" data-duration="1.365"><span class="box">dust and sunlight,</span></div>
<div id="cap19" class="clip cap" data-start="27.834" data-duration="2.071"><span class="box">but nothing had seriously failed.</span></div>
<div id="cap20" class="clip cap" data-start="30.177" data-duration="2.311"><span class="box">Later, Apollo 17's rover lost</span></div>
<div id="cap21" class="clip cap" data-start="32.498" data-duration="0.479"><span class="box">a fender,</span></div>
<div id="cap22" class="clip cap" data-start="32.987" data-duration="1.140"><span class="box">and the astronauts fixed it</span></div>
<div id="cap23" class="clip cap" data-start="34.137" data-duration="1.252"><span class="box">with maps and tape.</span></div>
<div id="cap24" class="clip cap" data-start="35.660" data-duration="0.491"><span class="box">Up there,</span></div>
<div id="cap25" class="clip cap" data-start="36.161" data-duration="2.059"><span class="box">there are no spare parts.</span></div>
<div id="cap26" class="clip cap" data-start="38.700" data-duration="0.970"><span class="box">On the Moon,</span></div>
<div id="cap27" class="clip cap" data-start="39.686" data-duration="1.151"><span class="box">a broken wrench is not</span></div>
<div id="cap28" class="clip cap" data-start="40.847" data-duration="1.133"><span class="box">a small problem.</span></div>
<div id="cap29" class="clip cap" data-start="42.235" data-duration="2.641"><span class="box">The next one is 384,000</span></div>
<div id="cap30" class="clip cap" data-start="44.886" data-duration="1.265"><span class="box">kilometres away,</span></div>
<div id="cap31" class="clip cap" data-start="46.222" data-duration="1.173"><span class="box">and sending it can cost</span></div>
<div id="cap32" class="clip cap" data-start="47.405" data-duration="1.151"><span class="box">up to a million dollars</span></div>
<div id="cap33" class="clip cap" data-start="48.566" data-duration="1.670"><span class="box">per kilogram.</span></div>
<div id="cap34" class="clip cap" data-start="50.716" data-duration="1.424"><span class="box">In 2026,</span></div>
<div id="cap35" class="clip cap" data-start="52.150" data-duration="1.516"><span class="box">NASA Glenn grew a plastic</span></div>
<div id="cap36" class="clip cap" data-start="53.676" data-duration="1.776"><span class="box">inside bacteria and mixed it</span></div>
<div id="cap37" class="clip cap" data-start="55.462" data-duration="1.538"><span class="box">with simulated Moon and Mars</span></div>
<div id="cap38" class="clip cap" data-start="57.010" data-duration="1.903"><span class="box">dust: a material that could</span></div>
<div id="cap39" class="clip cap" data-start="58.923" data-duration="1.262"><span class="box">be made on site.</span></div>
<div id="cap40" class="clip cap" data-start="60.456" data-duration="1.046"><span class="box">But which mix?</span></div>
<div id="cap41" class="clip cap" data-start="61.773" data-duration="1.116"><span class="box">How much dust,</span></div>
<div id="cap42" class="clip cap" data-start="62.899" data-duration="0.946"><span class="box">and is it strong enough</span></div>
<div id="cap43" class="clip cap" data-start="63.855" data-duration="0.979"><span class="box">for a wrench?</span></div>
<div id="cap44" class="clip cap" data-start="65.105" data-duration="1.561"><span class="box">You can't test every combination</span></div>
<div id="cap45" class="clip cap" data-start="66.676" data-duration="1.091"><span class="box">on Earth.</span></div>
<div id="cap46" class="clip cap" data-start="68.247" data-duration="1.333"><span class="box">So, for the Abandoned but</span></div>
<div id="cap47" class="clip cap" data-start="69.590" data-duration="1.388"><span class="box">not Forgotten challenge,</span></div>
<div id="cap48" class="clip cap" data-start="71.059" data-duration="2.252"><span class="box">we built the Moon-Material Simulator.</span></div>
<div id="cap49" class="clip cap" data-start="73.582" data-duration="0.799"><span class="box">Pick a binder,</span></div>
<div id="cap50" class="clip cap" data-start="74.391" data-duration="0.627"><span class="box">a soil,</span></div>
<div id="cap51" class="clip cap" data-start="75.028" data-duration="0.878"><span class="box">and how the part is</span></div>
<div id="cap52" class="clip cap" data-start="75.916" data-duration="1.570"><span class="box">made. Instantly,</span></div>
<div id="cap53" class="clip cap" data-start="77.496" data-duration="1.321"><span class="box">a physics model corrected by</span></div>
<div id="cap54" class="clip cap" data-start="78.827" data-duration="2.210"><span class="box">machine learning predicts eight properties,</span></div>
<div id="cap55" class="clip cap" data-start="81.047" data-duration="1.276"><span class="box">shows how sure it is,</span></div>
<div id="cap56" class="clip cap" data-start="82.333" data-duration="1.037"><span class="box">and tells you whether each</span></div>
<div id="cap57" class="clip cap" data-start="83.380" data-duration="1.185"><span class="box">number is backed by real</span></div>
<div id="cap58" class="clip cap" data-start="84.575" data-duration="0.945"><span class="box">lab data.</span></div>
<div id="cap59" class="clip cap" data-start="85.791" data-duration="1.561"><span class="box">It runs in any browser,</span></div>
<div id="cap60" class="clip cap" data-start="87.362" data-duration="2.116"><span class="box">and it's open source.</span></div>
<div id="cap61" class="clip cap" data-start="89.958" data-duration="1.644"><span class="box">Our science stands on NASA's</span></div>
<div id="cap62" class="clip cap" data-start="91.612" data-duration="1.024"><span class="box">own data:</span></div>
<div id="cap63" class="clip cap" data-start="92.891" data-duration="1.889"><span class="box">Glenn's bioplastic reports,</span></div>
<div id="cap64" class="clip cap" data-start="94.950" data-duration="2.071"><span class="box">Kennedy's regolith-printing studies,</span></div>
<div id="cap65" class="clip cap" data-start="97.031" data-duration="1.830"><span class="box">a 2003 NASA report,</span></div>
<div id="cap66" class="clip cap" data-start="98.871" data-duration="1.813"><span class="box">and peer-reviewed papers.</span></div>
<div id="cap67" class="clip cap" data-start="100.938" data-duration="3.363"><span class="box">We transcribed 1,470 measured values,</span></div>
<div id="cap68" class="clip cap" data-start="104.311" data-duration="1.605"><span class="box">each tied to its page.</span></div>
<div id="cap69" class="clip cap" data-start="106.170" data-duration="1.009"><span class="box">Then we built an auditor</span></div>
<div id="cap70" class="clip cap" data-start="107.189" data-duration="1.327"><span class="box">that finds every number again</span></div>
<div id="cap71" class="clip cap" data-start="108.526" data-duration="1.451"><span class="box">in the original PDF.</span></div>
<div id="cap72" class="clip cap" data-start="110.232" data-duration="1.452"><span class="box">It never edits data.</span></div>
<div id="cap73" class="clip cap" data-start="111.938" data-duration="1.621"><span class="box">Zero transcription errors,</span></div>
<div id="cap74" class="clip cap" data-start="113.569" data-duration="1.787"><span class="box">and 181 problems found in</span></div>
<div id="cap75" class="clip cap" data-start="115.366" data-duration="2.054"><span class="box">the papers themselves.</span></div>
<div id="cap76" class="clip cap" data-start="117.912" data-duration="1.857"><span class="box">Physics alone isn't enough:</span></div>
<div id="cap77" class="clip cap" data-start="120.023" data-duration="2.171"><span class="box">its strength error averaged 230</span></div>
<div id="cap78" class="clip cap" data-start="122.204" data-duration="1.696"><span class="box">percent. So we kept the</span></div>
<div id="cap79" class="clip cap" data-start="123.910" data-duration="1.260"><span class="box">physics and taught a Gaussian</span></div>
<div id="cap80" class="clip cap" data-start="125.180" data-duration="1.484"><span class="box">process its mistakes,</span></div>
<div id="cap81" class="clip cap" data-start="126.769" data-duration="2.393"><span class="box">using 152 real measurements.</span></div>
<div id="cap82" class="clip cap" data-start="129.417" data-duration="1.692"><span class="box">On mixes it never saw,</span></div>
<div id="cap83" class="clip cap" data-start="131.137" data-duration="1.940"><span class="box">that error drops from 230</span></div>
<div id="cap84" class="clip cap" data-start="133.087" data-duration="1.374"><span class="box">to 34 percent,</span></div>
<div id="cap85" class="clip cap" data-start="134.620" data-duration="2.114"><span class="box">stiffness from 65 to 19,</span></div>
<div id="cap86" class="clip cap" data-start="136.744" data-duration="1.633"><span class="box">and density from 16 to</span></div>
<div id="cap87" class="clip cap" data-start="138.387" data-duration="2.047"><span class="box">5. A completely new study</span></div>
<div id="cap88" class="clip cap" data-start="140.444" data-duration="0.659"><span class="box">is harder,</span></div>
<div id="cap89" class="clip cap" data-start="141.113" data-duration="1.111"><span class="box">and we say so.</span></div>
<div id="cap90" class="clip cap" data-start="142.427" data-duration="1.151"><span class="box">And every prediction links to</span></div>
<div id="cap91" class="clip cap" data-start="143.588" data-duration="0.838"><span class="box">its evidence:</span></div>
<div id="cap92" class="clip cap" data-start="144.628" data-duration="2.422"><span class="box">we predict 117 megapascals,</span></div>
<div id="cap93" class="clip cap" data-start="147.060" data-duration="2.897"><span class="box">and the paper measured 119.</span></div>
<div id="cap94" class="clip cap" data-start="150.437" data-duration="1.172"><span class="box">Back to our wrench:</span></div>
<div id="cap95" class="clip cap" data-start="151.792" data-duration="2.061"><span class="box">NASA's bioplastic with 38 percent</span></div>
<div id="cap96" class="clip cap" data-start="153.863" data-duration="0.932"><span class="box">lunar dust.</span></div>
<div id="cap97" class="clip cap" data-start="155.066" data-duration="1.766"><span class="box">It breaks at 71 newtons,</span></div>
<div id="cap98" class="clip cap" data-start="156.842" data-duration="1.287"><span class="box">just short of the 72</span></div>
<div id="cap99" class="clip cap" data-start="158.139" data-duration="1.389"><span class="box">needed to tighten a bolt.</span></div>
<div id="cap100" class="clip cap" data-start="159.799" data-duration="1.367"><span class="box">At lunar noon it softens</span></div>
<div id="cap101" class="clip cap" data-start="161.176" data-duration="1.297"><span class="box">to a sixth of that.</span></div>
<div id="cap102" class="clip cap" data-start="162.744" data-duration="1.139"><span class="box">At lunar night it's almost</span></div>
<div id="cap103" class="clip cap" data-start="163.893" data-duration="0.912"><span class="box">twice as strong,</span></div>
<div id="cap104" class="clip cap" data-start="164.815" data-duration="0.875"><span class="box">but brittle:</span></div>
<div id="cap105" class="clip cap" data-start="165.816" data-duration="2.185"><span class="box">it snaps instead of bending.</span></div>
<div id="cap106" class="clip cap" data-start="168.481" data-duration="1.616"><span class="box">So we ask the optimizer.</span></div>
<div id="cap107" class="clip cap" data-start="170.352" data-duration="1.599"><span class="box">It tests nearly five thousand</span></div>
<div id="cap108" class="clip cap" data-start="171.961" data-duration="1.349"><span class="box">mixes and finds one made</span></div>
<div id="cap109" class="clip cap" data-start="173.320" data-duration="1.933"><span class="box">entirely from local resources:</span></div>
<div id="cap110" class="clip cap" data-start="175.466" data-duration="2.137"><span class="box">45 percent dust and 15</span></div>
<div id="cap111" class="clip cap" data-start="177.613" data-duration="1.550"><span class="box">percent basalt fibre.</span></div>
<div id="cap112" class="clip cap" data-start="179.418" data-duration="2.009"><span class="box">Safety factor 1.7,</span></div>
<div id="cap113" class="clip cap" data-start="181.499" data-duration="1.096"><span class="box">and it bends before it</span></div>
<div id="cap114" class="clip cap" data-start="182.605" data-duration="1.210"><span class="box">breaks.</span></div>
<div id="cap115" class="clip cap" data-start="184.295" data-duration="0.946"><span class="box">Ask it for a rocket</span></div>
<div id="cap116" class="clip cap" data-start="185.251" data-duration="1.675"><span class="box">nozzle, and it honestly says</span></div>
<div id="cap117" class="clip cap" data-start="186.936" data-duration="1.524"><span class="box">no plastic survives.</span></div>
<div id="cap118" class="clip cap" data-start="188.731" data-duration="1.230"><span class="box">But a kit of 25</span></div>
<div id="cap119" class="clip cap" data-start="189.971" data-duration="1.516"><span class="box">small parts printed on site</span></div>
<div id="cap120" class="clip cap" data-start="191.497" data-duration="1.378"><span class="box">keeps 10 kilograms off the</span></div>
<div id="cap121" class="clip cap" data-start="192.885" data-duration="0.854"><span class="box">launch pad:</span></div>
<div id="cap122" class="clip cap" data-start="193.921" data-duration="2.720"><span class="box">up to 10 million dollars.</span></div>
<div id="cap123" class="clip cap" data-start="197.121" data-duration="1.627"><span class="box">We're Dreams of X:</span></div>
<div id="cap124" class="clip cap" data-start="199.002" data-duration="1.107"><span class="box">five friends,</span></div>
<div id="cap125" class="clip cap" data-start="200.119" data-duration="0.926"><span class="box">one team.</span></div>
<div id="cap126" class="clip cap" data-start="201.299" data-duration="1.682"><span class="box">Mahdin Islam Mukim,</span></div>
<div id="cap127" class="clip cap" data-start="203.019" data-duration="1.364"><span class="box">Maliha Sanjana,</span></div>
<div id="cap128" class="clip cap" data-start="204.552" data-duration="1.758"><span class="box">Lamisa Yeasmin Nakia,</span></div>
<div id="cap129" class="clip cap" data-start="206.425" data-duration="2.547"><span class="box">Yousuf Abdullah and Habibullah Sharif.</span></div>
<div id="cap130" class="clip cap" data-start="209.227" data-duration="0.800"><span class="box">We researched,</span></div>
<div id="cap131" class="clip cap" data-start="210.037" data-duration="1.677"><span class="box">designed, built and tested it</span></div>
<div id="cap132" class="clip cap" data-start="211.724" data-duration="1.287"><span class="box">together.</span></div>
<div id="cap133" class="clip cap" data-start="213.491" data-duration="1.219"><span class="box">The machines we left behind</span></div>
<div id="cap134" class="clip cap" data-start="214.720" data-duration="0.889"><span class="box">taught us what the Moon</span></div>
<div id="cap135" class="clip cap" data-start="215.619" data-duration="1.274"><span class="box">does to materials.</span></div>
<div id="cap136" class="clip cap" data-start="217.165" data-duration="1.584"><span class="box">Now our simulator helps engineers</span></div>
<div id="cap137" class="clip cap" data-start="218.759" data-duration="1.242"><span class="box">choose the right mix before</span></div>
<div id="cap138" class="clip cap" data-start="220.011" data-duration="1.570"><span class="box">a single sample is printed.</span></div>
<div id="cap139" class="clip cap" data-start="221.852" data-duration="0.832"><span class="box">And it's for learning,</span></div>
<div id="cap140" class="clip cap" data-start="222.694" data-duration="1.456"><span class="box">too: students,</span></div>
<div id="cap141" class="clip cap" data-start="224.160" data-duration="1.651"><span class="box">teachers, and anyone who loves</span></div>
<div id="cap142" class="clip cap" data-start="225.821" data-duration="1.459"><span class="box">rockets and space can explore</span></div>
<div id="cap143" class="clip cap" data-start="227.290" data-duration="1.311"><span class="box">NASA's real data and see</span></div>
<div id="cap144" class="clip cap" data-start="228.611" data-duration="1.968"><span class="box">the measurement behind every answer.</span></div>
<div id="cap145" class="clip cap" data-start="230.850" data-duration="1.162"><span class="box">The same method works for</span></div>
<div id="cap146" class="clip cap" data-start="232.022" data-duration="2.037"><span class="box">Mars. Try it yourself.</span></div>

  </div>
  <script>

const tl = gsap.timeline({ paused: true });
const q = (s) => document.querySelector(s);
