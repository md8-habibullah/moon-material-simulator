  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="238.743">
<div id="cap0" class="clip cap" data-start="0.250" data-duration="0.838"><span class="box">On the Moon and on</span></div>
<div id="cap1" class="clip cap" data-start="1.098" data-duration="1.661"><span class="box">Mars, there are machines NASA</span></div>
<div id="cap2" class="clip cap" data-start="2.769" data-duration="1.030"><span class="box">left behind.</span></div>
<div id="cap3" class="clip cap" data-start="4.139" data-duration="2.098"><span class="box">A lander from 1967.</span></div>
<div id="cap4" class="clip cap" data-start="6.276" data-duration="1.986"><span class="box">Rovers parked by astronauts.</span></div>
<div id="cap5" class="clip cap" data-start="8.272" data-duration="1.395"><span class="box">A little helicopter that flew</span></div>
<div id="cap6" class="clip cap" data-start="9.677" data-duration="1.389"><span class="box">72 times.</span></div>
<div id="cap7" class="clip cap" data-start="11.338" data-duration="0.907"><span class="box">They're abandoned,</span></div>
<div id="cap8" class="clip cap" data-start="12.255" data-duration="1.180"><span class="box">but not forgotten:</span></div>
<div id="cap9" class="clip cap" data-start="13.590" data-duration="1.221"><span class="box">each one still tells us</span></div>
<div id="cap10" class="clip cap" data-start="14.821" data-duration="1.232"><span class="box">what those worlds do to</span></div>
<div id="cap11" class="clip cap" data-start="16.063" data-duration="1.400"><span class="box">the things we build.</span></div>
<div id="cap12" class="clip cap" data-start="17.943" data-duration="1.627"><span class="box">When Apollo 12 landed next</span></div>
<div id="cap13" class="clip cap" data-start="19.580" data-duration="1.255"><span class="box">to Surveyor 3,</span></div>
<div id="cap14" class="clip cap" data-start="20.845" data-duration="1.128"><span class="box">the crew brought pieces of</span></div>
<div id="cap15" class="clip cap" data-start="21.983" data-duration="0.774"><span class="box">it home.</span></div>
<div id="cap16" class="clip cap" data-start="22.819" data-duration="1.383"><span class="box">After 31 months on the</span></div>
<div id="cap17" class="clip cap" data-start="24.212" data-duration="1.407"><span class="box">Moon, they were darkened by</span></div>
<div id="cap18" class="clip cap" data-start="25.629" data-duration="1.308"><span class="box">dust and sunlight,</span></div>
<div id="cap19" class="clip cap" data-start="26.999" data-duration="1.957"><span class="box">but nothing had seriously failed.</span></div>
<div id="cap20" class="clip cap" data-start="29.367" data-duration="2.184"><span class="box">Later, Apollo 17's rover lost</span></div>
<div id="cap21" class="clip cap" data-start="31.561" data-duration="0.733"><span class="box">a fender,</span></div>
<div id="cap22" class="clip cap" data-start="32.304" data-duration="1.302"><span class="box">and the astronauts fixed it</span></div>
<div id="cap23" class="clip cap" data-start="33.616" data-duration="1.308"><span class="box">with maps and tape.</span></div>
<div id="cap24" class="clip cap" data-start="35.172" data-duration="0.628"><span class="box">Up there,</span></div>
<div id="cap25" class="clip cap" data-start="35.810" data-duration="1.761"><span class="box">there are no spare parts.</span></div>
<div id="cap26" class="clip cap" data-start="38.052" data-duration="0.675"><span class="box">On the Moon,</span></div>
<div id="cap27" class="clip cap" data-start="38.737" data-duration="1.163"><span class="box">a broken wrench is not</span></div>
<div id="cap28" class="clip cap" data-start="39.910" data-duration="1.087"><span class="box">a small problem.</span></div>
<div id="cap29" class="clip cap" data-start="41.268" data-duration="2.045"><span class="box">The next one is 384,000</span></div>
<div id="cap30" class="clip cap" data-start="43.323" data-duration="1.163"><span class="box">kilometres away,</span></div>
<div id="cap31" class="clip cap" data-start="44.496" data-duration="1.116"><span class="box">and sending it can cost</span></div>
<div id="cap32" class="clip cap" data-start="45.622" data-duration="1.046"><span class="box">up to a million dollars</span></div>
<div id="cap33" class="clip cap" data-start="46.678" data-duration="1.668"><span class="box">per kilogram.</span></div>
<div id="cap34" class="clip cap" data-start="48.826" data-duration="1.279"><span class="box">In 2026,</span></div>
<div id="cap35" class="clip cap" data-start="50.115" data-duration="1.476"><span class="box">NASA Glenn grew a plastic</span></div>
<div id="cap36" class="clip cap" data-start="51.601" data-duration="1.847"><span class="box">inside bacteria and mixed it</span></div>
<div id="cap37" class="clip cap" data-start="53.458" data-duration="1.535"><span class="box">with simulated Moon and Mars</span></div>
<div id="cap38" class="clip cap" data-start="55.003" data-duration="1.743"><span class="box">dust: a material that could</span></div>
<div id="cap39" class="clip cap" data-start="56.756" data-duration="1.226"><span class="box">be made on site.</span></div>
<div id="cap40" class="clip cap" data-start="58.474" data-duration="1.116"><span class="box">But which mix?</span></div>
<div id="cap41" class="clip cap" data-start="59.600" data-duration="1.047"><span class="box">How much dust,</span></div>
<div id="cap42" class="clip cap" data-start="60.657" data-duration="0.930"><span class="box">and is it strong enough</span></div>
<div id="cap43" class="clip cap" data-start="61.597" data-duration="0.890"><span class="box">for a wrench?</span></div>
<div id="cap44" class="clip cap" data-start="62.805" data-duration="1.603"><span class="box">You can't test every combination</span></div>
<div id="cap45" class="clip cap" data-start="64.418" data-duration="0.972"><span class="box">on Earth.</span></div>
<div id="cap46" class="clip cap" data-start="65.870" data-duration="1.267"><span class="box">So, for the Abandoned but</span></div>
<div id="cap47" class="clip cap" data-start="67.147" data-duration="1.354"><span class="box">not Forgotten challenge,</span></div>
<div id="cap48" class="clip cap" data-start="68.517" data-duration="2.341"><span class="box">we built the Moon-Material Simulator.</span></div>
<div id="cap49" class="clip cap" data-start="70.978" data-duration="0.815"><span class="box">Pick a binder,</span></div>
<div id="cap50" class="clip cap" data-start="71.803" data-duration="0.779"><span class="box">a soil,</span></div>
<div id="cap51" class="clip cap" data-start="72.592" data-duration="0.873"><span class="box">and how the part is</span></div>
<div id="cap52" class="clip cap" data-start="73.475" data-duration="1.534"><span class="box">made. Instantly,</span></div>
<div id="cap53" class="clip cap" data-start="75.019" data-duration="1.499"><span class="box">a physics model corrected by</span></div>
<div id="cap54" class="clip cap" data-start="76.528" data-duration="2.417"><span class="box">machine learning predicts eight properties,</span></div>
<div id="cap55" class="clip cap" data-start="78.955" data-duration="1.401"><span class="box">shows how sure it is,</span></div>
<div id="cap56" class="clip cap" data-start="80.406" data-duration="1.186"><span class="box">and tells you whether each</span></div>
<div id="cap57" class="clip cap" data-start="81.602" data-duration="1.430"><span class="box">number is backed by real</span></div>
<div id="cap58" class="clip cap" data-start="83.042" data-duration="1.029"><span class="box">lab data.</span></div>
<div id="cap59" class="clip cap" data-start="84.237" data-duration="1.372"><span class="box">It runs in any browser,</span></div>
<div id="cap60" class="clip cap" data-start="85.619" data-duration="2.062"><span class="box">and it's open source.</span></div>
<div id="cap61" class="clip cap" data-start="88.161" data-duration="1.604"><span class="box">Our science stands on NASA's</span></div>
<div id="cap62" class="clip cap" data-start="89.775" data-duration="1.064"><span class="box">own data:</span></div>
<div id="cap63" class="clip cap" data-start="90.855" data-duration="2.312"><span class="box">NASA Glenn's bacterial-plastic reports,</span></div>
<div id="cap64" class="clip cap" data-start="93.177" data-duration="2.486"><span class="box">NASA Kennedy's regolith-printing studies,</span></div>
<div id="cap65" class="clip cap" data-start="95.673" data-duration="1.963"><span class="box">a 2003 NASA report,</span></div>
<div id="cap66" class="clip cap" data-start="97.646" data-duration="1.680"><span class="box">and peer-reviewed papers.</span></div>
<div id="cap67" class="clip cap" data-start="99.608" data-duration="3.293"><span class="box">We transcribed 1,470 measured values,</span></div>
<div id="cap68" class="clip cap" data-start="102.917" data-duration="1.540"><span class="box">each tied to its page.</span></div>
<div id="cap69" class="clip cap" data-start="104.577" data-duration="1.244"><span class="box">Then we built an auditor</span></div>
<div id="cap70" class="clip cap" data-start="105.831" data-duration="1.499"><span class="box">that finds every number again</span></div>
<div id="cap71" class="clip cap" data-start="107.340" data-duration="1.575"><span class="box">in the original PDF.</span></div>
<div id="cap72" class="clip cap" data-start="109.035" data-duration="1.622"><span class="box">It never edits data.</span></div>
<div id="cap73" class="clip cap" data-start="110.881" data-duration="1.639"><span class="box">Zero transcription errors,</span></div>
<div id="cap74" class="clip cap" data-start="112.530" data-duration="2.208"><span class="box">and 181 problems inside the</span></div>
<div id="cap75" class="clip cap" data-start="114.748" data-duration="1.865"><span class="box">papers themselves.</span></div>
<div id="cap76" class="clip cap" data-start="117.093" data-duration="2.004"><span class="box">Physics alone isn't enough:</span></div>
<div id="cap77" class="clip cap" data-start="119.218" data-duration="1.145"><span class="box">on real samples,</span></div>
<div id="cap78" class="clip cap" data-start="120.379" data-duration="3.043"><span class="box">its compressive-strength error averaged 230</span></div>
<div id="cap79" class="clip cap" data-start="123.432" data-duration="1.673"><span class="box">percent. So we kept the</span></div>
<div id="cap80" class="clip cap" data-start="125.115" data-duration="1.500"><span class="box">physics and taught a Gaussian</span></div>
<div id="cap81" class="clip cap" data-start="126.625" data-duration="1.609"><span class="box">process its mistakes,</span></div>
<div id="cap82" class="clip cap" data-start="128.355" data-duration="2.526"><span class="box">using 152 real measurements.</span></div>
<div id="cap83" class="clip cap" data-start="131.106" data-duration="1.650"><span class="box">On mixes it never saw,</span></div>
<div id="cap84" class="clip cap" data-start="132.766" data-duration="1.975"><span class="box">that error drops from 230</span></div>
<div id="cap85" class="clip cap" data-start="134.751" data-duration="1.482"><span class="box">to 34 percent,</span></div>
<div id="cap86" class="clip cap" data-start="136.307" data-duration="2.469"><span class="box">stiffness from 65 to 19,</span></div>
<div id="cap87" class="clip cap" data-start="138.792" data-duration="1.731"><span class="box">and density from 16 to</span></div>
<div id="cap88" class="clip cap" data-start="140.533" data-duration="1.987"><span class="box">5. A completely new study</span></div>
<div id="cap89" class="clip cap" data-start="142.530" data-duration="0.501"><span class="box">is harder,</span></div>
<div id="cap90" class="clip cap" data-start="143.041" data-duration="1.099"><span class="box">and we say so.</span></div>
<div id="cap91" class="clip cap" data-start="144.260" data-duration="1.523"><span class="box">And every prediction links to</span></div>
<div id="cap92" class="clip cap" data-start="145.793" data-duration="0.924"><span class="box">its evidence:</span></div>
<div id="cap93" class="clip cap" data-start="146.768" data-duration="2.881"><span class="box">we predict 117 megapascals,</span></div>
<div id="cap94" class="clip cap" data-start="149.659" data-duration="2.480"><span class="box">and the paper measured 119.</span></div>
<div id="cap95" class="clip cap" data-start="152.619" data-duration="1.255"><span class="box">Back to our wrench:</span></div>
<div id="cap96" class="clip cap" data-start="153.884" data-duration="2.440"><span class="box">NASA's bioplastic with 38 percent</span></div>
<div id="cap97" class="clip cap" data-start="156.334" data-duration="0.971"><span class="box">lunar dust.</span></div>
<div id="cap98" class="clip cap" data-start="157.449" data-duration="1.987"><span class="box">It breaks at 71 newtons,</span></div>
<div id="cap99" class="clip cap" data-start="159.446" data-duration="1.429"><span class="box">just short of the 72</span></div>
<div id="cap100" class="clip cap" data-start="160.885" data-duration="1.494"><span class="box">needed to tighten a bolt.</span></div>
<div id="cap101" class="clip cap" data-start="162.696" data-duration="1.477"><span class="box">At lunar noon it softens</span></div>
<div id="cap102" class="clip cap" data-start="164.183" data-duration="1.249"><span class="box">to a sixth of that.</span></div>
<div id="cap103" class="clip cap" data-start="165.576" data-duration="1.336"><span class="box">At lunar night it's almost</span></div>
<div id="cap104" class="clip cap" data-start="166.922" data-duration="1.012"><span class="box">twice as strong,</span></div>
<div id="cap105" class="clip cap" data-start="167.944" data-duration="0.878"><span class="box">but brittle:</span></div>
<div id="cap106" class="clip cap" data-start="168.966" data-duration="2.027"><span class="box">it snaps instead of bending.</span></div>
<div id="cap107" class="clip cap" data-start="171.474" data-duration="1.691"><span class="box">So we ask the optimizer.</span></div>
<div id="cap108" class="clip cap" data-start="173.204" data-duration="1.650"><span class="box">It tests nearly five thousand</span></div>
<div id="cap109" class="clip cap" data-start="174.864" data-duration="1.499"><span class="box">mixes and finds one made</span></div>
<div id="cap110" class="clip cap" data-start="176.373" data-duration="1.982"><span class="box">entirely from local resources:</span></div>
<div id="cap111" class="clip cap" data-start="178.568" data-duration="1.952"><span class="box">45 percent dust and 15</span></div>
<div id="cap112" class="clip cap" data-start="180.530" data-duration="1.621"><span class="box">percent basalt fibre.</span></div>
<div id="cap113" class="clip cap" data-start="182.678" data-duration="1.847"><span class="box">Safety factor 1.7,</span></div>
<div id="cap114" class="clip cap" data-start="184.535" data-duration="1.058"><span class="box">and it bends before it</span></div>
<div id="cap115" class="clip cap" data-start="185.603" data-duration="1.227"><span class="box">breaks.</span></div>
<div id="cap116" class="clip cap" data-start="187.310" data-duration="0.977"><span class="box">Ask it for a rocket</span></div>
<div id="cap117" class="clip cap" data-start="188.297" data-duration="1.592"><span class="box">nozzle, and it honestly says</span></div>
<div id="cap118" class="clip cap" data-start="189.899" data-duration="1.505"><span class="box">no plastic survives.</span></div>
<div id="cap119" class="clip cap" data-start="191.675" data-duration="1.186"><span class="box">But a kit of 25</span></div>
<div id="cap120" class="clip cap" data-start="192.871" data-duration="1.836"><span class="box">small parts printed on site</span></div>
<div id="cap121" class="clip cap" data-start="194.717" data-duration="1.395"><span class="box">keeps 10 kilograms off the</span></div>
<div id="cap122" class="clip cap" data-start="196.122" data-duration="0.913"><span class="box">launch pad:</span></div>
<div id="cap123" class="clip cap" data-start="197.376" data-duration="2.318"><span class="box">up to 10 million dollars.</span></div>
<div id="cap124" class="clip cap" data-start="200.174" data-duration="1.447"><span class="box">We're Dreams of X.</span></div>
<div id="cap125" class="clip cap" data-start="201.695" data-duration="1.499"><span class="box">Mahdin Islam Mukim,</span></div>
<div id="cap126" class="clip cap" data-start="203.204" data-duration="0.878"><span class="box">team lead.</span></div>
<div id="cap127" class="clip cap" data-start="204.203" data-duration="0.953"><span class="box">Maliha Sanjana,</span></div>
<div id="cap128" class="clip cap" data-start="205.166" data-duration="2.486"><span class="box">design. Lamisa Yeasmin Nakia,</span></div>
<div id="cap129" class="clip cap" data-start="207.662" data-duration="1.506"><span class="box">research and storytelling.</span></div>
<div id="cap130" class="clip cap" data-start="209.288" data-duration="0.930"><span class="box">And the two who built</span></div>
<div id="cap131" class="clip cap" data-start="210.228" data-duration="0.849"><span class="box">most of it:</span></div>
<div id="cap132" class="clip cap" data-start="211.087" data-duration="1.163"><span class="box">Yousuf Abdullah,</span></div>
<div id="cap133" class="clip cap" data-start="212.260" data-duration="1.656"><span class="box">AI and data science,</span></div>
<div id="cap134" class="clip cap" data-start="213.990" data-duration="1.632"><span class="box">and Habibullah Sharif,</span></div>
<div id="cap135" class="clip cap" data-start="215.638" data-duration="1.796"><span class="box">the simulator itself.</span></div>
<div id="cap136" class="clip cap" data-start="217.914" data-duration="1.679"><span class="box">The machines we left behind</span></div>
<div id="cap137" class="clip cap" data-start="219.632" data-duration="1.082"><span class="box">taught us what the Moon</span></div>
<div id="cap138" class="clip cap" data-start="220.724" data-duration="1.423"><span class="box">does to materials.</span></div>
<div id="cap139" class="clip cap" data-start="222.419" data-duration="2.161"><span class="box">Now our simulator helps engineers</span></div>
<div id="cap140" class="clip cap" data-start="224.590" data-duration="1.569"><span class="box">choose the right mix before</span></div>
<div id="cap141" class="clip cap" data-start="226.169" data-duration="1.714"><span class="box">a single sample is printed,</span></div>
<div id="cap142" class="clip cap" data-start="227.922" data-duration="1.475"><span class="box">and shows the real measurement</span></div>
<div id="cap143" class="clip cap" data-start="229.407" data-duration="1.587"><span class="box">behind every answer.</span></div>
<div id="cap144" class="clip cap" data-start="231.265" data-duration="1.279"><span class="box">The same method works for</span></div>
<div id="cap145" class="clip cap" data-start="232.554" data-duration="2.109"><span class="box">Mars. Try it yourself.</span></div>

  </div>
  <script>

const tl = gsap.timeline({ paused: true });
const q = (s) => document.querySelector(s);
const fmtInt = (v) => Math.round(v).toLocaleString('en-US');
function count(sel, from, to, at, dur, fmt) {
